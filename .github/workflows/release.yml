name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tag = process.env.RELEASE_TAG;
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const versions = JSON.parse(readFileSync('versions.json', 'utf8'));

          if (!/^\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Invalid release tag: ${tag}`);
          }

          if (manifest.version !== tag || pkg.version !== tag) {
            throw new Error('Release tag and package versions do not match');
          }

          if (versions[tag] !== manifest.minAppVersion) {
            throw new Error('versions.json is inconsistent with manifest.json');
          }

          console.log(`Validated release ${tag}`);
          NODE

      - name: Build plugin
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(main.js manifest.json)

          if [[ -f styles.css ]]; then
            files+=(styles.css)
          fi

          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
